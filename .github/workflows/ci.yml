name: CI

# Requirements doc, section 53-56: "CI/CD: GitHub Actions (flutter
# analyze, flutter test, backend lint, pytest)". Two independent jobs —
# a backend-only change shouldn't wait on (or be blocked by) mobile
# tooling and vice versa.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: ruff check .

      - run: pytest -q

  mobile:
    name: Mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - run: flutter pub get

      # pubspec.yaml bundles .env as an asset; it's gitignored (real
      # Supabase keys never get committed — see README's "Environment
      # variables" section), so a clean checkout has none and `flutter
      # analyze` fails on a missing-asset warning. Empty values are fine:
      # nothing analyze/test does actually reads them.
      - run: cp .env.example .env

      # freezed/drift generated files are gitignored (mobile/**/*.g.dart,
      # mobile/**/*.freezed.dart) — every checkout needs to regenerate
      # them before analyze/test can even resolve the code.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test
